name: Build

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Required to enable vcpkg's built-in GitHub Actions binary cache backend.
      # Packages built by vcpkg are stored per-package in the Actions cache so
      # even a partial cache hit avoids rebuilding individual libraries.
      - name: Export vcpkg binary cache environment variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Primary cache: the fully assembled ThirdParty tree.
      # Cache is invalidated automatically when setup_x64_deps.ps1 changes.
      # restore-keys lets a partial match seed the cache so only changed
      # packages need to be rebuilt by vcpkg.
      - name: Cache ThirdParty
        uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ThirdParty-${{ runner.os }}-${{ hashFiles('scripts/setup_x64_deps.ps1') }}
          restore-keys: |
            ThirdParty-${{ runner.os }}-

      - name: Set up MSVC x64 environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvarsall = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          cmd /c "`"$vcvarsall`" x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT;$env:PATH"
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          .\scripts\setup_x64_deps.ps1 -RepoRoot ${{ github.workspace }}

      - name: Configure
        run: cmake --preset x64-Release -DBUILDNUMBER=${{ github.run_number }}

      - name: Build
        run: cmake --build --preset x64-Release

      - name: Rename installer
        shell: pwsh
        run: Rename-Item "bin\WMV_Installer.exe" "WMV_Installer_v0.11.0.${{ github.run_number }}.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: WMV_Installer_v0.11.0.${{ github.run_number }}
          path: bin\WMV_Installer_v*.exe

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.WEBHOOK_URL }}
          status: ${{ job.status }}
